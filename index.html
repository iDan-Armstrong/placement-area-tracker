<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Placement Area Tracker</title>
<style>
:root{--bg:#eef2f4;--panel:#fff;--ink:#14212b;--mute:#5a6976;--line:#d3dbe1;--soft:#f5f8fa;--accent:#0a5f8a;--accent-ink:#fff;
 --g:#2e8b57;--y:#d9a400;--r:#c0392b;--o:#7b8794;--i:#b9c2ca;--none:#dfe5ea;--warn-bg:#fff3d6;--warn:#8a5a00;--bad-bg:#fbe9e7;--bad:#b3261e;--ok-bg:#e6f4ea;--ok:#1d7a3a;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Consolas,"Cascadia Mono",monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0e1419;--panel:#161e26;--ink:#e4e9ee;--mute:#93a1ae;--line:#2a343e;--soft:#1b242d;--accent:#4aa8d8;--accent-ink:#06202e;--none:#2a343e;--i:#55616c;--warn-bg:#2e2410;--warn:#e3b341;--bad-bg:#33171a;--bad:#ff8a80;--ok-bg:#12291b;--ok:#5fd08a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3{margin:0;font-weight:600}
.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:17px}
.top .sub{color:var(--mute);font-size:12.5px}
.top .sp{flex:1}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 11px;font-size:13px}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:2px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.9fr);gap:14px;padding:14px 16px;align-items:start}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.pnl>header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pnl>header h2{font-size:15px}
.pnl>header .sp{flex:1}
.pnl .in{padding:12px 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px 16px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.tile span{display:block;color:var(--mute);font-size:12px}
.tile b{font:600 20px var(--mono);font-variant-numeric:tabular-nums}
.tile small{color:var(--mute);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft);position:sticky;top:0}
td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{font-family:var(--mono);font-size:12.5px}
tr.row{cursor:pointer}
tr.row:hover{background:var(--soft)}
tr.row.sel{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
tr:last-child td{border-bottom:0}
.tw{overflow:auto;max-height:520px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--none)}
.G{background:var(--g)}.Y{background:var(--y)}.R{background:var(--r)}.O{background:var(--o)}.I{background:var(--i)}
.bar{width:90px;height:8px;background:var(--none);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%}
.muted{color:var(--mute)}
.small{font-size:12.5px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mute)}
label.f>*{color:var(--ink)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
input.big{font:600 20px var(--mono);text-align:right}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg .full{grid-column:1/-1}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--panel);padding:6px 8px;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.ba{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 10px;align-items:center;font-size:13px;margin-top:12px;background:var(--soft);border-radius:8px;padding:10px 12px}
.ba .h{grid-column:1/-1;font-size:12px;color:var(--mute);font-weight:600}
.ba .k{color:var(--mute)}
.ba .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.ba .arrow{color:var(--mute)}
.ba .new{font-weight:700}
.msg{border-radius:6px;padding:7px 10px;font-size:13px;margin-top:8px}
.msg.warn{background:var(--warn-bg);color:var(--warn)}.msg.bad{background:var(--bad-bg);color:var(--bad)}.msg.ok{background:var(--ok-bg);color:var(--ok)}
svg.map{width:100%;height:520px;display:block;background:var(--soft);border-radius:0 0 10px 10px}
svg.map path{stroke:var(--panel);stroke-width:1.5;cursor:pointer;vector-effect:non-scaling-stroke}
svg.map path.sel{stroke:var(--ink);stroke-width:3}
svg.map text{font:600 22px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:5px;pointer-events:none;text-anchor:middle}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:2px}
.tabs button{border:0;background:none;padding:6px 10px;border-bottom:2px solid transparent;color:var(--mute);font-weight:500}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f1620;color:#e4e9ee;border-radius:8px;padding:8px 14px;font-size:13px;z-index:9}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:min(560px,calc(100vw - 32px));padding:18px}
dialog::backdrop{background:rgba(5,10,15,.5)}
[hidden]{display:none!important}
@media (max-width:980px){.wrap{grid-template-columns:1fr}svg.map{height:380px}}

.banner{background:var(--warn-bg);color:var(--warn);padding:6px 16px;font-size:13px;font-weight:600}
.center{max-width:560px;margin:60px auto;padding:0 16px}
.center .pnl .in{padding:20px}
.center p{margin:0 0 12px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:8px 10px;font-size:13px;margin:10px 16px 0;white-space:pre-wrap;word-break:break-word}
.busy{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
